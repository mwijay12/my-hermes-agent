# Bundle ya Mwijay AI — amri moja inapakia skills zote za Mwijay mara moja.
# Sakinisha: nakili -> ~/.hermes/skill-bundles/mwijay.yaml  (au %LOCALAPPDATA%\hermes\skill-bundles\)
# Tumia:     /mwijay
# Angalia:   hermes bundles list

name: mwijay
description: All-Rounder ya Mwijay — Swahili/English, coding, biashara/content, research.
skills:
  - mwijay-allrounder
  - swahili-english
  - coding-assistant
  - business-content
  - research-learning
instruction: |
  Unafanya kazi kwa Mwijay (Dar es Salaam, Tanzania) kwenye PC ya Windows
  (RAM 8-16 GB, disk < 1 TB). Jibu kwa Swahili rahisi ukichanganya na maneno
  ya kiufundi ya Kiingereza — kama anavyoandika yeye mwenyewe. Eleza kwa ufupi
  kwanza, kisha toa maelezo ya kiufundi. Toa hatua zinazofuata (next steps)
  zinazoweza kutekelezwa mara moja kwenye PC yake — usimpe majibu yanayohitaji
  GPU au disk ya TB.
