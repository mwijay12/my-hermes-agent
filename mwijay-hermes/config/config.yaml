# Hermes Agent — Config ya Mwijay AI
# Nakili faili hii kwenda: %LOCALAPPDATA%\hermes\config.yaml (Windows)
# au ~/.hermes/config.yaml (Linux/WSL2)
# API keys HAZIWEKI hapa — zinawekwa kwenye .env (angalia .env.example)

model:
  # Default: auto-detect kulingana na keys ulizoweka kwenye .env
  # Ukipenda kulazimisha Gemini: provider: "gemini"
  # Ukipenda Groq: provider: "custom" + base_url ya Groq (angalia chini)
  provider: "auto"
  default: "google/gemini-2.5-flash"
  base_url: "https://openrouter.ai/api/v1"

# --- Groq ni provider RASMI sasa (imeongezwa kwenye repo hii) ---
# Badili sehemu ya "model" hapo juu iwe:
# model:
#   provider: "groq"
#   default: "openai/gpt-oss-120b"     # au "openai/gpt-oss-20b" / "qwen/qwen3.8-27b"
# Kisha weka GROQ_API_KEY kwenye .env. Inatumia https://api.groq.com/openai/v1
# na inasaidia credential-pool rotation (funguo nyingi zinazunguka moja baada ya nyingine).
#
# Njia ya zamani (OpenAI-compatible custom endpoint) bado inafanya kazi:
# model:
#   provider: "custom"
#   base_url: "https://api.groq.com/openai/v1"
#   default: "llama-3.3-70b-versatile"

# --- Personalities za Mwijay AI ---
# Tumia: /personality mwijay  (kwenye chat)
# NOTE: personalities lazima iwe chini ya sehemu ya "agent:" — kama inavyoonyeshwa hapa.
agent:
  personalities:
    mwijay: "You are Mwijay AI, Mwijay's personal all-rounder assistant. Speak Swahili mixed with English technical terms, warm and friendly, teach simply then give technical detail. Help with coding, business, research and automation."
    mwijay_teacher: "You are Mwijay AI in teacher mode. Explain concepts step by step in simple Swahili with examples, then add the technical detail. Be patient and encouraging."
    mwijay_coder: "You are Mwijay AI in coding mode. Write clean code, debug systematically, explain what each part does in simple Swahili/English. Prefer practical solutions that work on a Windows PC with 8-16GB RAM."
    mwijay_business: "You are Mwijay AI in business mode. Help with content, social media, marketing and business ideas for Tanzania/East Africa market. Be creative and practical."
    helpful: "You are a helpful, friendly AI assistant."
    concise: "You are a concise assistant. Keep responses brief and to the point."
    technical: "You are a technical expert. Provide detailed, accurate technical information."

# --- Skills ---
# Njia rahisi ya kutokopi skills: weka external_dirs ielekeze kwenye folda
# ya skills za repo hii. Badilisha path iwe ya PC yako.
skills:
  creation_nudge_interval: 15   # Agent anajikumbusha kutengeneza skill mpya baada ya kazi ngumu
  # external_dirs:
  #   - "C:\\Users\\MWIJAY\\my-hermes-agent\\mwijay-hermes\\skills"    # Windows
  #   - "~/my-hermes-agent/skills/mwijay-ai"                          # Linux/WSL2

# --- Toolsets: All-Rounder (kila kitu) ---
platform_toolsets:
  cli: [hermes-cli]
  telegram: [hermes-telegram]
  discord: [hermes-discord]
  whatsapp: [hermes-whatsapp]
  slack: [hermes-slack]
  signal: [hermes-signal]

# =====================================================================
# MWONO ONEKANO WA TERMINAL (display) — "kuipendezesha"
# =====================================================================
# Hiki ndicho kinachofanya terminal yako iwe ya Mwijay AI, si ya Hermes.
# Maelezo zaidi: mwijay-hermes/personalize.html
display:
  skin: mwijay                 # rangi za Tanzania (au "mwijay-mwanga" kwa terminal nyeupe)
  personality: mwijay          # sauti yake: Swahili rahisi + English ya kiufundi
  # interface: cli             # "cli" = terminal ya kawaida (default), "tui" = paneli la kisasa
  streaming: true              # maandishi yanatoka taratibu badala ya mara moja
  timestamps: true             # onyesha saa kando ya kila ujumbe
  timestamp_format: "%H:%M"
  final_response_markdown: render   # render (zuri) | strip | raw
  turn_summary: true           # mstari wa mwisho: "⋯ 12.4s · edited 2 files…"
  spinner_token_flow: true     # onyesha tokeni zinazotumika kwenye spinner
  friendly_tool_labels: true   # "Inasoma faili…" badala ya "read_file"
  inline_diffs: true           # onyesha tofauti za faili moja kwa moja
  bell_on_complete: true       # mlio mfupi anapomaliza (hata ukiwa kwenye dirisha lingine)
  show_cost: true              # onyesha gharama ($0.00 kwa free tiers — inasaidia kuona uvujaji)
  status_phrases:              # misemo ya Kiswahili anayotuma Telegram wakati anafanya kazi
    path: status_phrases/mwijay.yaml
    mode: replace              # replace = Kiswahili pekee | append = changanya na Kiingereza

# =====================================================================
# ROTATION YA FREE LLM — "akili inayozunguka"
# =====================================================================
# Orodha kamili ya providers wa bure + jinsi ya kupata keys:
#   angalia mwijay-hermes/free-providers.html (fungua kwenye browser)
#   na mwijay-hermes/config/.env.free.example (majina ya env variables)
#
# JARIBU KEYS ZAKO KWANZA:
#   python3 mwijay-hermes/scripts/check_free_keys.py

# --- Providers wa custom (OpenAI-compatible, hawapo "native" kwenye Hermes) ---
# Hawa huongezwa kama custom endpoints. Hakikisha umeweka key kwenye .env
# (env variable imetajwa kwenye key_env). Ondoa au weka "enabled: false"
# kwa yeyote usiyemtaka.
providers:
  inception:
    name: "Inception Mercury"
    api: "https://api.inceptionlabs.ai/v1"
    key_env: INCEPTION_API_KEY
    default_model: "mercury-2"
    models: ["mercury-2", "mercury-coder-small"]
    transport: chat_completions

  agnes:
    name: "Agnes AI"
    api: "https://apihub.agnes-ai.com/v1"
    key_env: AGNES_API_KEY
    default_model: "agnes-2.0-flash"
    transport: chat_completions

  cerebras:
    name: "Cerebras"
    api: "https://api.cerebras.ai/v1"
    key_env: CEREBRAS_API_KEY
    default_model: "gpt-oss-120b"
    transport: chat_completions

  sambanova:
    name: "SambaNova"
    api: "https://api.sambanova.ai/v1"
    key_env: SAMBANOVA_API_KEY
    default_model: "Meta-Llama-3.3-70B-Instruct"
    transport: chat_completions

  github-models:
    name: "GitHub Models"
    api: "https://models.github.ai/inference"
    key_env: GITHUB_TOKEN
    default_model: "openai/gpt-4o-mini"
    transport: chat_completions

  llm7:
    name: "LLM7.io"
    api: "https://api.llm7.io/v1"
    key_env: LLM7_API_KEY
    default_model: "gpt-oss-20b"
    transport: chat_completions

  siliconflow:
    name: "SiliconFlow"
    api: "https://api.siliconflow.cn/v1"
    key_env: SILICONFLOW_API_KEY
    default_model: "Qwen/Qwen3-8B"
    transport: chat_completions

  chutes:
    name: "Chutes.ai"
    api: "https://api.chutes.ai/v1"
    key_env: CHUTES_API_KEY
    default_model: "chutesai/Llama-3.3-70B-Instruct"
    transport: chat_completions
    enabled: false

# --- Mnyororo wa fallback: Hermes inazunguka yenyewe ---
# Inapopata rate limit (429), hitilafu ya 5xx, au key isiyofanya kazi,
# inaendelea na provider anayefuata bila kupoteza mazungumzo.
# Panga kuanzia yule mwenye kikomo kikubwa kwenda mdogo.
# Unaweza pia kusanidi hiki kwa: hermes fallback
# (fallback_providers ndiyo muundo mpya/kanuni; fallback_model bado inakubaliwa)
fallback_providers:
  - provider: "groq"
    model: "openai/gpt-oss-120b"
  - provider: "cerebras"
    model: "gpt-oss-120b"
  - provider: "nvidia"
    model: "z-ai/glm-5.2"
  - provider: "inception"
    model: "mercury-2"
  - provider: "opencode-zen"
    model: "deepseek-v4-flash-free"
  - provider: "gemini"
    model: "gemini-3.8-flash"
  - provider: "openrouter"
    model: "nvidia/nemotron-3-ultra-550b-a55b:free"
  - provider: "github-models"
    model: "openai/gpt-4o-mini"
  - provider: "llm7"
    model: "gpt-oss-20b"

# --- Memory ---
# MEMORY.md na USER.md zinadhibitiwa kutoka profile/ — nakili kwenye HERMES_HOME

# --- Mikakati ya credential pool (funguo nyingi kwa provider mmoja) ---
# Kwanza ongeza funguo:  hermes auth add groq --api-key gsk_...
# Kisha:  hermes auth list
# Chaguo: fill_first (default) | round_robin | least_used | random
credential_pool_strategies:
  groq: round_robin
  openrouter: least_used
  cerebras: round_robin
